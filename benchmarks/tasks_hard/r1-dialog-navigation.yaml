  "anti_gaming": "All predicates evaluate the REAL filesystem and window state, never driver self-report. output_written_during_run fails files that pre-date the run. content_carried_over_and_appended proves the source lines and the appended marker both reached the copy, so hand-creating a bare file cannot pass. exactly_one_task_notepad_window fails when the driver leaves stray Notepad documents (or a second copy of the task doc) open. The scorer records nothing about HOW the dialog was driven; the dialog-UI requirement (folder reached/created with the dialog's own controls, full-path typing at most as one step of the flow) is a prompt-level discipline verified by run review, not by the scorer.",
