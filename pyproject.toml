[project]
name = "computer-use-mcp"
version = "0.4.1"
description = "Cortex - a safe, screenshot-grounded computer-use MCP server that lets AI agents see, decide and act on the Windows desktop with semantic verification"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0,<2.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "Pillow>=10.0.0",
  "mss>=9.0.1",
  "pyautogui>=0.9.54; sys_platform == 'win32'",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[project.scripts]
computer-use-mcp = "computer_use_mcp.server:main"
cortex = "computer_use_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
